<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ location }} - Departures</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080c10;
      --header-bg: #0d2244;
      --accent: #1a56a8;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --text: #e8edf2;
      --muted: #6b7280;
      --border: #1a2030;
      --table-head: #0d1520;
      --status-bg: #05090e;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ─── */
    header {
      background: var(--header-bg);
      padding: 8px 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--accent);
      flex-shrink: 0;
    }

    .location-name {
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-weight: 700;
    }

    .clock {
      font-size: clamp(1.8rem, 4vw, 3.4rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-family: "Courier New", monospace;
    }

    /* ─── Two-panel layout ─── */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .panel+.panel {
      border-left: 3px solid var(--accent);
    }

    /* ─── Platform banner ─── */
    .platform-banner {
      background: var(--accent);
      color: #fff;
      font-size: clamp(1rem, 1.8vw, 1.5rem);
      font-weight: 700;
      padding: 12px 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    /* ─── Table ─── */
    .table-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      background: var(--table-head);
      padding: 10px 18px;
      font-size: clamp(0.75rem, 1.3vw, 1rem);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .col-route {
      width: 15%;
    }

    .col-dest {
      width: 52%;
    }

    .col-sched {
      width: 8%;
    }

    .col-arriving {
      width: 25%;
      text-align: right;
    }

    thead th.col-arriving {
      text-align: right;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: clamp(10px, 2vh, 22px) 18px;
      font-size: clamp(1.1rem, 2vw, 1.7rem);
      vertical-align: middle;
    }

    .route-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 5px 12px;
      border-radius: 5px;
      font-weight: 700;
      font-size: clamp(1rem, 1.8vw, 1.6rem);
      text-align: center;
      min-width: 56px;
    }

    /* ─── Destination cell ─── */
    .dest-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dest-type {
      font-size: clamp(0.65rem, 1.1vw, 0.95rem);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── Scrolling destination text ─── */
    .dest-wrap {
      overflow: hidden;
      white-space: nowrap;
    }

    .dest-inner {
      display: inline-block;
    }

    .dest-wrap.scrolling .dest-inner {
      animation: marquee-loop var(--marquee-dur, 12s) linear infinite;
    }

    @keyframes marquee-loop {

      0%,
      20% {
        transform: translateX(0);
      }

      80%,
      100% {
        transform: translateX(-50%);
      }
    }

    /* ─── Arriving column ─── */
    .arriving {
      display: block;
      font-weight: 700;
      font-size: clamp(1.2rem, 2.2vw, 2rem);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .arriving.green {
      color: var(--green);
    }

    .arriving.amber {
      color: var(--amber);
    }

    .arriving.red {
      color: var(--red);
    }

    /* NOW only blinks */
    .arriving.now {
      color: var(--red);
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* ─── Filler rows ─── */
    .filler-row td {
      padding: clamp(10px, 2vh, 22px) 18px;
      font-size: clamp(1.1rem, 2vw, 1.7rem);
    }

    /* ─── No service ─── */
    .no-service {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.5rem);
      padding: 40px 18px;
      text-align: center;
    }

    /* ─── Status bar ─── */
    .status-bar {
      height: 30px;
      background: var(--status-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 0.72rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .status-bar .error {
      color: var(--red);
    }
  </style>
</head>

<body>

  <header>
    <div class="location-name">{{ location }}</div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="main">
    <div class="panel">
      <div class="platform-banner" id="p1-banner">Platform 1</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-route">Route</th>
              <th class="col-dest">Destination</th>
              <th class="col-sched">Sched.</th>
              <th class="col-arriving">Arriving</th>
            </tr>
          </thead>
          <tbody id="p1-tbody">
            <tr>
              <td colspan="4">
                <div class="no-service">Loading&hellip;</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="platform-banner" id="p2-banner">Platform 2</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-route">Route</th>
              <th class="col-dest">Destination</th>
              <th class="col-sched">Sched.</th>
              <th class="col-arriving">Arriving</th>
            </tr>
          </thead>
          <tbody id="p2-tbody">
            <tr>
              <td colspan="4">
                <div class="no-service">Loading&hellip;</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-left">Connecting&hellip;</span>
    <span>TransLink Open Data</span>
  </div>

  <script>
    // ── Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        [now.getHours(), now.getMinutes(), now.getSeconds()]
          .map(n => String(n).padStart(2, '0')).join(':');
    }

    // ── Format arrival (mirrors native.py logic)
    function formatArrival(arrTs) {
      const diff = arrTs - Math.floor(Date.now() / 1000);
      if (diff <= 0) return { text: 'NOW', cls: 'now' };
      if (diff < 120) return { text: `${Math.ceil(diff / 60)} min`, cls: 'red' };
      if (diff < 300) return { text: `${Math.ceil(diff / 60)} min`, cls: 'amber' };
      return { text: `${Math.floor(diff / 60)} min`, cls: 'green' };
    }

    const SERVICE_TYPE_KEYWORDS = ['buz', 'express', 'rocket', 'nightlink', 'loop', 'city precincts'];

    function serviceTypeLabel(serviceType) {
      if (!serviceType) return '';
      const lower = serviceType.toLowerCase();
      if (!SERVICE_TYPE_KEYWORDS.some(kw => lower.includes(kw))) return '';
      return `<div class="dest-type">${escHtml(serviceType)}</div>`;
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Apply marquee to overflowing destination cells
    function applyScrolling(tbody) {
      tbody.querySelectorAll('.dest-wrap').forEach(wrap => {
        const inner = wrap.querySelector('.dest-inner');
        if (!inner) return;

        // Restore original text before measuring (handles resize re-calls)
        if (inner.dataset.orig !== undefined) {
          inner.textContent = inner.dataset.orig;
        }
        wrap.classList.remove('scrolling');
        wrap.style.removeProperty('--marquee-dur');

        const overflow = inner.scrollWidth - wrap.clientWidth;
        if (overflow > 4) {
          const orig = inner.textContent;
          inner.dataset.orig = orig;
          // Duplicate with a gap so the loop is seamless
          inner.innerHTML = escHtml(orig) + '<span style="display:inline-block;min-width:4em"></span>'
            + escHtml(orig) + '<span style="display:inline-block;min-width:4em"></span>';
          // 60% of total duration is scrolling at 60px/s; 20% pause at each end
          const dur = Math.max(8, (inner.scrollWidth / 2) / 60 / 0.60);
          wrap.style.setProperty('--marquee-dur', `${dur}s`);
          wrap.classList.add('scrolling');
        }
      });
    }

    const MIN_ROWS = 8;

    // ── Render one platform panel
    function renderPanel(tbodyId, bannerId, deps, label) {
      document.getElementById(bannerId).textContent = label;
      const tbody = document.getElementById(tbodyId);

      const rows = [];

      if (!deps || deps.length === 0) {
        rows.push('<tr><td colspan="4"><div class="no-service">No upcoming services</div></td></tr>');
      } else {
        rows.push(...deps.map(d => {
          const { text, cls } = formatArrival(d.arrival_ts);
          return `<tr data-ts="${d.arrival_ts}" data-route="${escHtml(d.route)}" data-headsign="${escHtml(d.headsign || '')}">
        <td><span class="route-badge">${escHtml(d.route)}</span></td>
        <td><div class="dest-cell"><div class="dest-wrap"><span class="dest-inner">${escHtml(d.headsign || '—')}</span></div>${serviceTypeLabel(d.service_type)}</div></td>
        <td>${escHtml(d.scheduled)}</td>
        <td><span class="arriving ${cls}" data-arrival>${text}</span></td>
      </tr>`;
        }));
        for (let i = deps.length; i < MIN_ROWS; i++) {
          rows.push('<tr class="filler-row"><td colspan="4"></td></tr>');
        }
      }

      tbody.innerHTML = rows.join('');
      requestAnimationFrame(() => applyScrolling(tbody));
    }

    // ── Audio Announcements
    let _lastDeps = [];
    let _audioReady = false;
    const _clientAlerted = new Map();   // key → alerted_at_ts
    const _announceQueue = [];
    let _announcePlaying = false;
    let _announceTemplate = 'Bus {route} to {headsign}, arriving in 1 minute.';
    let _announceTemplateNoHeadsign = 'Bus {route}, arriving in 1 minute.';

    async function _loadTemplates() {
      try {
        const resp = await fetch('/api/settings');
        if (!resp.ok) return;
        const s = await resp.json();
        if (s.announce_template) _announceTemplate = s.announce_template;
        if (s.announce_template_no_headsign) _announceTemplateNoHeadsign = s.announce_template_no_headsign;
      } catch (e) { }
    }
    _loadTemplates();

    function _unlockAudio() {
      if (_audioReady) return;
      _audioReady = true;
      const badge = document.getElementById('audio-badge');
      if (badge) badge.remove();
    }

    function _drainQueue() {
      if (_announcePlaying || _announceQueue.length === 0) return;
      const { route, headsign, platform } = _announceQueue.shift();
      _announcePlaying = true;

      const chimeUrl = platform === 2 ? '/audio/chime/up' : '/audio/chime/down';
      const tmpl = headsign ? _announceTemplate : _announceTemplateNoHeadsign;
      const text = tmpl.replace('{route}', route).replace('{headsign}', headsign);
      const ttsUrl = '/api/tts?' + new URLSearchParams({ text, platform: String(platform) });

      // Prefetch TTS in parallel with the chime
      const tts = new Audio(ttsUrl);
      tts.preload = 'auto';
      tts.load();

      const chime = new Audio(chimeUrl);
      chime.play().catch(() => { _announcePlaying = false; _drainQueue(); });
      chime.addEventListener('ended', () => {
        tts.play().catch(() => { _announcePlaying = false; _drainQueue(); });
        tts.addEventListener('ended', () => { _announcePlaying = false; _drainQueue(); });
      });
    }

    function _checkAnnouncements() {
      if (!_audioReady) return;
      const nowTs = Math.floor(Date.now() / 1000);
      for (const dep of _lastDeps) {
        const diff = dep.arrival_ts - nowTs;
        // Key by route+scheduled (stable across API refreshes) instead of arrival_ts
        const key = `${dep.route}|${dep.scheduled}`;
        if (diff > 0 && diff <= 60 && !_clientAlerted.has(key)) {
          _clientAlerted.set(key, nowTs);
          _announceQueue.push({ route: dep.route, headsign: dep.headsign || '', platform: dep._platform });
          _drainQueue();
        }
      }
      for (const [key, alertedAt] of _clientAlerted) {
        if (alertedAt < nowTs - 300) _clientAlerted.delete(key);
      }
    }

    // Non-intrusive audio unlock badge (hidden if kiosk auto-unlock succeeds)
    (function () {
      const badge = document.createElement('span');
      badge.id = 'audio-badge';
      badge.style.cssText = 'cursor:pointer;color:var(--amber);margin-left:1rem;';
      badge.textContent = '[click to enable audio]';
      badge.addEventListener('click', _unlockAudio);
      const sl = document.getElementById('status-left');
      sl.parentNode.insertBefore(badge, sl.nextSibling);
    })();

    document.addEventListener('click', _unlockAudio, { once: true });

    // Auto-unlock for kiosk / browsers with autoplay allowed
    (async () => {
      try {
        const a = new Audio('/audio/chime');
        a.volume = 0;
        await a.play();
        a.pause();
        _unlockAudio();
      } catch (e) { }
    })();

    // ── Per-second arrival tick (avoids full re-render)
    function tickArrival() {
      document.querySelectorAll('tr[data-ts]').forEach(row => {
        const span = row.querySelector('[data-arrival]');
        if (!span) return;
        const { text, cls } = formatArrival(parseInt(row.dataset.ts, 10));
        span.textContent = text;
        span.className = `arriving ${cls}`;
      });
      _checkAnnouncements();
    }

    // ── Re-check scrolling on window resize
    function onResize() {
      ['p1-tbody', 'p2-tbody'].forEach(id => {
        const el = document.getElementById(id);
        if (el) applyScrolling(el);
      });
    }
    window.addEventListener('resize', onResize);

    // ── Fetch from Flask API
    async function fetchData() {
      try {
        const resp = await fetch('/api/departures');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        renderPanel('p1-tbody', 'p1-banner', data.p1, data.p1_label || 'Platform 1');
        renderPanel('p2-tbody', 'p2-banner', data.p2, data.p2_label || 'Platform 2');
        _lastDeps = [
          ...(data.p1 || []).map(d => ({ ...d, _platform: 1 })),
          ...(data.p2 || []).map(d => ({ ...d, _platform: 2 })),
        ];

        const el = document.getElementById('status-left');
        if (data.error) {
          el.textContent = `Error: ${data.error}`;
          el.className = 'error';
        } else {
          const stops = (data.stop_ids || []).join(', ');
          el.textContent = `Updated: ${data.updated}  |  Stops: ${stops}`;
          el.className = '';
        }
      } catch (e) {
        const el = document.getElementById('status-left');
        el.textContent = 'Connection error — retrying…';
        el.className = 'error';
      }
    }

    // ── Init
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(tickArrival, 1000);

    fetchData();
    setInterval(fetchData, 30000);
  </script>
</body>

</html>
