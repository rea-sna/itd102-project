<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ location }} - Departures</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #080c10;
      --header-bg:  #0d2244;
      --accent:     #1a56a8;
      --green:      #22c55e;
      --amber:      #f59e0b;
      --red:        #ef4444;
      --text:       #e8edf2;
      --muted:      #6b7280;
      --border:     #1a2030;
      --table-head: #0d1520;
      --status-bg:  #05090e;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ─── */
    header {
      background: var(--header-bg);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--accent);
      flex-shrink: 0;
    }

    .location-name {
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-weight: 700;
    }

    .clock {
      font-size: clamp(1.8rem, 4vw, 3.4rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-family: "Courier New", monospace;
    }

    /* ─── Two-panel layout ─── */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .panel + .panel {
      border-left: 3px solid var(--accent);
    }

    /* ─── Platform banner ─── */
    .platform-banner {
      background: var(--accent);
      color: #fff;
      font-size: clamp(1rem, 1.8vw, 1.5rem);
      font-weight: 700;
      padding: 12px 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    /* ─── Table ─── */
    .table-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      background: var(--table-head);
      padding: 10px 18px;
      font-size: clamp(0.75rem, 1.3vw, 1rem);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .col-route    { width: 14%; }
    .col-dest     { width: 44%; }
    .col-sched    { width: 16%; }
    .col-arriving { width: 26%; text-align: right; }

    thead th.col-arriving { text-align: right; }

    tbody tr { border-bottom: 1px solid var(--border); }

    tbody td {
      padding: clamp(10px, 2vh, 22px) 18px;
      font-size: clamp(1.1rem, 2vw, 1.7rem);
      vertical-align: middle;
    }

    .route-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 5px 12px;
      border-radius: 5px;
      font-weight: 700;
      font-size: clamp(1rem, 1.8vw, 1.6rem);
      text-align: center;
      min-width: 56px;
    }

    /* ─── Scrolling destination text ─── */
    .dest-wrap {
      overflow: hidden;
      white-space: nowrap;
    }

    .dest-inner {
      display: inline-block;
    }

    .dest-wrap.scrolling .dest-inner {
      animation: marquee-text var(--marquee-dur, 12s) ease-in-out infinite;
    }

    @keyframes marquee-text {
      0%,  20% { transform: translateX(0); }
      80%, 100% { transform: translateX(var(--marquee-dist, 0px)); }
    }

    /* ─── Arriving column ─── */
    .arriving {
      display: block;
      font-weight: 700;
      font-size: clamp(1.2rem, 2.2vw, 2rem);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .arriving.green { color: var(--green); }
    .arriving.amber { color: var(--amber); }
    .arriving.red   { color: var(--red); }
    /* NOW only blinks */
    .arriving.now   { color: var(--red); animation: blink 1s step-end infinite; }

    @keyframes blink { 50% { opacity: 0; } }

    /* ─── No service ─── */
    .no-service {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.5rem);
      padding: 40px 18px;
      text-align: center;
    }

    /* ─── Status bar ─── */
    .status-bar {
      height: 30px;
      background: var(--status-bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 0.72rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .status-bar .error { color: var(--red); }
  </style>
</head>
<body>

<header>
  <div class="location-name">{{ location }}</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="main">
  <div class="panel">
    <div class="platform-banner" id="p1-banner">Platform 1</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-route">Route</th>
            <th class="col-dest">Destination</th>
            <th class="col-sched">Sched.</th>
            <th class="col-arriving">Arriving</th>
          </tr>
        </thead>
        <tbody id="p1-tbody">
          <tr><td colspan="4"><div class="no-service">Loading&hellip;</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="platform-banner" id="p2-banner">Platform 2</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-route">Route</th>
            <th class="col-dest">Destination</th>
            <th class="col-sched">Sched.</th>
            <th class="col-arriving">Arriving</th>
          </tr>
        </thead>
        <tbody id="p2-tbody">
          <tr><td colspan="4"><div class="no-service">Loading&hellip;</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="status-bar">
  <span id="status-left">Connecting&hellip;</span>
  <span>TransLink Open Data</span>
</div>

<script>
  // ── Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      [now.getHours(), now.getMinutes(), now.getSeconds()]
        .map(n => String(n).padStart(2, '0')).join(':');
  }

  // ── Format arrival (mirrors native.py logic)
  function formatArrival(arrTs) {
    const diff = arrTs - Math.floor(Date.now() / 1000);
    if (diff <= 0)   return { text: 'NOW',                         cls: 'now'   };
    if (diff < 120)  return { text: `${Math.ceil(diff / 60)} min`, cls: 'red'   };
    if (diff < 300)  return { text: `${Math.ceil(diff / 60)} min`, cls: 'amber' };
    return                  { text: `${Math.floor(diff / 60)} min`, cls: 'green' };
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ── Apply marquee to overflowing destination cells
  function applyScrolling(tbody) {
    tbody.querySelectorAll('.dest-wrap').forEach(wrap => {
      const inner = wrap.querySelector('.dest-inner');
      if (!inner) return;
      const overflow = inner.scrollWidth - wrap.clientWidth;
      if (overflow > 4) {
        const dur = Math.max(8, overflow / 30);
        wrap.style.setProperty('--marquee-dist', `${-overflow}px`);
        wrap.style.setProperty('--marquee-dur',  `${dur}s`);
        wrap.classList.add('scrolling');
      } else {
        wrap.classList.remove('scrolling');
        wrap.style.removeProperty('--marquee-dist');
        wrap.style.removeProperty('--marquee-dur');
      }
    });
  }

  // ── Render one platform panel
  function renderPanel(tbodyId, bannerId, deps, label) {
    document.getElementById(bannerId).textContent = label;
    const tbody = document.getElementById(tbodyId);

    if (!deps || deps.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4"><div class="no-service">No upcoming services</div></td></tr>';
      return;
    }

    tbody.innerHTML = deps.map(d => {
      const { text, cls } = formatArrival(d.arrival_ts);
      return `<tr data-ts="${d.arrival_ts}" data-route="${escHtml(d.route)}" data-headsign="${escHtml(d.headsign || '')}">
        <td><span class="route-badge">${escHtml(d.route)}</span></td>
        <td><div class="dest-wrap"><span class="dest-inner">${escHtml(d.headsign || '—')}</span></div></td>
        <td>${escHtml(d.scheduled)}</td>
        <td><span class="arriving ${cls}" data-arrival>${text}</span></td>
      </tr>`;
    }).join('');

    requestAnimationFrame(() => applyScrolling(tbody));
  }

  // ── Per-second arrival tick (avoids full re-render)
  // アナウンスはサーバー側のバックグラウンドスレッドが担当する
  function tickArrival() {
    document.querySelectorAll('tr[data-ts]').forEach(row => {
      const span = row.querySelector('[data-arrival]');
      if (!span) return;
      const { text, cls } = formatArrival(parseInt(row.dataset.ts, 10));
      span.textContent = text;
      span.className   = `arriving ${cls}`;
    });
  }

  // ── Re-check scrolling on window resize
  function onResize() {
    ['p1-tbody', 'p2-tbody'].forEach(id => {
      const el = document.getElementById(id);
      if (el) applyScrolling(el);
    });
  }
  window.addEventListener('resize', onResize);

  // ── Fetch from Flask API
  async function fetchData() {
    try {
      const resp = await fetch('/api/departures');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();

      renderPanel('p1-tbody', 'p1-banner', data.p1, data.p1_label || 'Platform 1');
      renderPanel('p2-tbody', 'p2-banner', data.p2, data.p2_label || 'Platform 2');

      const el = document.getElementById('status-left');
      if (data.error) {
        el.textContent = `Error: ${data.error}`;
        el.className   = 'error';
      } else {
        const stops = (data.stop_ids || []).join(', ');
        el.textContent = `Updated: ${data.updated}  |  Stops: ${stops}`;
        el.className   = '';
      }
    } catch (e) {
      const el = document.getElementById('status-left');
      el.textContent = 'Connection error — retrying…';
      el.className   = 'error';
    }
  }

  // ── Init
  updateClock();
  setInterval(updateClock,  1000);
  setInterval(tickArrival,  1000);

  fetchData();
  setInterval(fetchData, 30000);
</script>
</body>
</html>
